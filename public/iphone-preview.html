<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fitly iPhone Preview</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #111;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      .wrap {
        display: grid;
        gap: 14px;
        justify-items: center;
      }

      .label {
        color: rgba(255, 255, 255, 0.72);
        font-size: 13px;
      }

      .phone {
        position: relative;
        width: 390px;
        height: 844px;
        overflow: hidden;
        border: 12px solid #050505;
        border-radius: 48px;
        background: white;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }

      .notch {
        position: absolute;
        z-index: 2;
        top: 10px;
        left: 50%;
        width: 118px;
        height: 28px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #050505;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="label">Fitly preview: iPhone 12/13/14 size, 390 x 844</div>
      <div class="phone">
        <div class="notch"></div>
        <iframe src="/" title="Fitly mobile preview"></iframe>
      </div>
    </main>
  </body>
</html>
